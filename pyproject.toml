[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-bot"
version = "0.1.0"
description = "Autonomous 0-1 DTE earnings/event options bot with hard risk limits (paper, IBKR, Alpaca)"
requires-python = ">=3.11"
dependencies = [
  "ib_async>=2.0",
  "alpaca-py>=0.40",
  "yfinance>=1.0",
  "anthropic>=2.0",
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "python-dotenv>=1.0",
  "pandas_market_calendars>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
earnings-bot = "earnings_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["earnings_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
