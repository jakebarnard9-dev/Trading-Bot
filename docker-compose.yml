services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./macro_events.yaml:/app/macro_events.yaml:ro
      - ./state:/app/state
      - ./logs:/app/logs
    restart: unless-stopped
    # For IBKR, TWS/IB Gateway must be reachable: either run it on the host with API access enabled
    # (set ibkr.host to host.docker.internal and add extra_hosts below), or run an ib-gateway container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
